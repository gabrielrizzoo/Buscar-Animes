<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3.0">
    <title>Buscar Animes</title>
</head>

<body>
    <main class="main-container">
        <header class="header">
            <h1>Buscar Animes</h1>
            <p class="subtitle">Faça buscas instantâneas no maior diretório de animes do mundo</p>
        </header>

        <section class="search-section">
            <form id="search-form" class="search-form">
                <label for="campo-pesquisa" class="sr-only">Digite o título de um Anime</label>
                <input type="search" placeholder="Ex: One Piece, Naruto..." id="campo-pesquisa" required>
                <button type="submit">Explorar</button>
            </form>
        </section>

        <section class="resultados-pesquisa" id="resultados-pesquisa" aria-live="polite">
            <!-- Loading ou Resultados renderizados dinamicamente via JS -->
        </section>
    </main>

    <footer>
        <p>2024 - Buscar Animes. Todos os Direitos Reservados.</p>
        <p>Desenvolvido usando API Jikan (MyAnimeList)</p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
